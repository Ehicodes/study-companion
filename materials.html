<dialog class="modal" id="folder-modal" aria-labelledby="folder-modal-title">
  <form class="modal__form" id="folder-form" novalidate>
    <h2 class="modal__title" id="folder-modal-title">New folder</h2>
    <p class="modal__text">Folders keep your materials sorted, like one per course.</p>

    <div class="modal__field">
      <label class="modal__label" for="folder-name">Folder name</label>
      <input class="modal__input" type="text" id="folder-name" name="folderName" maxlength="30" placeholder="e.g. Physics" autocomplete="off" aria-describedby="folder-error">
      <p class="modal__error" id="folder-error" role="alert" hidden></p>
    </div>

    <div class="modal__actions">
      <button type="button" class="btn btn--outline" id="folder-cancel">Cancel</button>
      <button type="submit" class="btn btn--primary">Save folder</button>
    </div>
  </form>
</dialog>

<dialog class="modal" id="material-modal" aria-labelledby="material-modal-title">
  <form class="modal__form" id="material-form" novalidate>
    <h2 class="modal__title" id="material-modal-title">Add material</h2>
    <p class="modal__text">Save a note, a link, or a record of a PDF or slides.</p>

    <div class="modal__field">
      <label class="modal__label" for="material-title">Title</label>
      <input class="modal__input" type="text" id="material-title" name="title" maxlength="60" placeholder="e.g. Array methods cheat sheet" autocomplete="off" aria-describedby="material-error">
    </div>

    <div class="modal__row">
      <div class="modal__field">
        <label class="modal__label" for="material-type">Type</label>
        <select class="modal__input" id="material-type" name="type">
          <option value="notes">Notes</option>
          <option value="link">Link</option>
          <option value="pdf">PDF</option>
          <option value="slides">Slides</option>
        </select>
      </div>

      <div class="modal__field">
        <label class="modal__label" for="material-folder">Folder</label>
        <select class="modal__input" id="material-folder" name="folder"></select>
      </div>
    </div>

    <div class="modal__field">
      <label class="modal__label" for="material-link">Link <span class="modal__optional">(optional)</span></label>
      <input class="modal__input" type="url" id="material-link" name="link" placeholder="https://"autocomplete="off">
    </div>

    <div class="modal__field">
      <label class="modal__label" for="material-note">Note <span class="modal__optional">(optional)</span></label>
      <textarea class="modal__input modal__input--area" id="material-note" name="note" rows="3" maxlength="300" placeholder="Anything to remember about it"></textarea>
    </div>

    <p class="modal__error" id="material-error" role="alert" hidden></p>

    <div class="modal__actions">
      <button type="button" class="btn btn--outline" id="material-cancel">Cancel</button>
      <button type="submit" class="btn btn--primary">Save material</button>
    </div>
  </form>
</dialog>

</body>
